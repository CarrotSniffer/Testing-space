<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0e1a" />
  <title>New Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0e1a;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', system-ui, sans-serif;
    }
    canvas {
      display: block;
      width: 100%; height: 100%;
      position: absolute; top: 0; left: 0;
    }

    /* Back button */
    #back-btn {
      position: absolute; left: 16px; top: 16px;
      width: 44px; height: 44px;
      background: rgba(30,40,65,0.85);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 10;
      text-decoration: none;
      transition: background 0.15s;
    }
    #back-btn:hover { background: rgba(233,69,96,0.3); }
    #back-btn svg {
      width: 22px; height: 22px;
      fill: none; stroke: #aabbdd; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
    }

    /* Score HUD */
    #hud {
      position: absolute; top: 16px; right: 16px;
      background: rgba(30,40,65,0.85);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 10px 20px;
      z-index: 10;
      text-align: center;
    }
    #hud .label {
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
      color: #546080; text-transform: uppercase;
    }
    #hud .value {
      font-size: 28px; font-weight: 800; color: #fff;
    }
  </style>
  <script type="module" crossorigin src="/Testing-space/assets/new-game-BQDtBvFN.js"></script>
  <link rel="modulepreload" crossorigin href="/Testing-space/assets/modulepreload-polyfill-B5Qt9EMX.js">
</head>
<body>
  <canvas id="game"></canvas>

  <a id="back-btn" href="../../">
    <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
  </a>

  <div id="hud">
    <div class="label">Score</div>
    <div class="value" id="score-value">0</div>
  </div>

</body>
</html>
