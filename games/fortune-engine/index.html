<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fortune" />
  <meta name="theme-color" content="#0a0e1a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="/Testing-space/assets/icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="/Testing-space/assets/favicon.png" />
  <title>Fortune Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0e1a;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', system-ui, sans-serif;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100%; height: 100%;
      position: absolute; top: 0; left: 0;
    }

    /* HUD */
    #hud {
      position: absolute; top: 0; left: 0; right: 0;
      padding: calc(env(safe-area-inset-top, 8px) + 10px) 16px 12px;
      background: rgba(10,14,26,0.97);
      z-index: 10; pointer-events: none;
    }
    .hud-row {
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .hud-main {
      font-size: 28px; font-weight: 900; color: #fff;
    }
    .hud-sub {
      font-size: 13px; font-weight: 600; color: #4ade80;
      margin-left: 8px;
    }
    .hud-secondary {
      display: flex; gap: 20px; margin-top: 6px;
    }
    .hud-stat { text-align: center; }
    .hud-label {
      font-size: 9px; font-weight: 700; letter-spacing: 1.2px;
      color: #546080; text-transform: uppercase;
    }
    .hud-value { font-size: 14px; font-weight: 800; color: #fff; }

    /* Back button */
    #back-btn {
      position: absolute; left: 14px;
      top: calc(env(safe-area-inset-top, 8px) + 10px);
      width: 34px; height: 34px;
      background: rgba(30,40,65,0.9);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 20;
      text-decoration: none;
      pointer-events: auto;
    }
    #back-btn svg {
      width: 16px; height: 16px;
      fill: none; stroke: #aabbdd; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
    }

    /* Tab Bar */
    #tabbar {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 8px 8px calc(env(safe-area-inset-bottom, 8px) + 4px);
      background: rgba(10,14,26,0.98);
      z-index: 10;
      display: flex; justify-content: space-around;
    }
    .tab-btn {
      flex: 1;
      display: flex; flex-direction: column; align-items: center;
      padding: 6px 4px 4px;
      background: none; border: none;
      cursor: pointer; color: #546080;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s;
    }
    .tab-btn.active { color: #e94560; }
    .tab-icon { font-size: 20px; line-height: 1; }
    .tab-label { font-size: 9px; font-weight: 700; margin-top: 2px; letter-spacing: 0.5px; }

    /* Toast */
    #toast {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(233,69,96,0.92); color: #fff;
      padding: 8px 20px; border-radius: 20px;
      font-size: 14px; font-weight: 700;
      pointer-events: none; z-index: 30;
      opacity: 0; transition: opacity 0.25s;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-row">
      <div style="padding-left: 44px;">
        <span class="hud-main" id="hud-cash">$1</span>
        <span class="hud-sub" id="hud-cps">$0/s</span>
      </div>
    </div>
    <div class="hud-secondary">
      <div class="hud-stat">
        <div class="hud-label">Net Worth</div>
        <div class="hud-value" id="hud-nw">$1</div>
      </div>
      <div class="hud-stat">
        <div class="hud-label">IK</div>
        <div class="hud-value" id="hud-ik">0</div>
      </div>
    </div>
  </div>

  <a id="back-btn" href="../../">
    <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
  </a>

  <div id="tabbar">
    <button class="tab-btn active" data-tab="business">
      <span class="tab-icon">&#x1F4BC;</span>
      <span class="tab-label">BUSINESS</span>
    </button>
    <button class="tab-btn" data-tab="portfolio">
      <span class="tab-icon">&#x1F4CA;</span>
      <span class="tab-label">PORTFOLIO</span>
    </button>
    <button class="tab-btn" data-tab="casino">
      <span class="tab-icon">&#x1F3B0;</span>
      <span class="tab-label">CASINO</span>
    </button>
    <button class="tab-btn" data-tab="more">
      <span class="tab-icon">&#x2699;</span>
      <span class="tab-label">MORE</span>
    </button>
  </div>

  <div id="toast"></div>

  <script type="module" src="/src/fortune-engine/main.ts"></script>
</body>
</html>
